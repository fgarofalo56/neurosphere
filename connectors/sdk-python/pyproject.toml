[project]
name = "neurosphere-connector"
version = "0.0.0"
description = "NeuroSphere connector SDK: base connector, manifest, health/rate-limit/coverage reporting, vault credential references and the contract test kit (PRP-09)."
requires-python = ">=3.12"
dependencies = [
  "neurosphere-contracts",
  "neurosphere-core",
  "pydantic>=2.14,<3",
]

[tool.uv.sources]
neurosphere-contracts = { workspace = true }
neurosphere-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurosphere_connector"]
