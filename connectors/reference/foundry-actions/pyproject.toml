[project]
name = "neurosphere-connector-foundry-actions"
version = "0.0.0"
description = "Foundry model-deployment swap write connector: dry-run, apply, verify, rollback, with an advisory mode (PRP-17 item 5)."
requires-python = ">=3.12"
dependencies = [
  "neurosphere-connector",
  "azure-core>=1.30",
  "httpx>=0.28,<0.29",
]

[tool.uv.sources]
neurosphere-connector = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurosphere_connector_foundry_actions"]
