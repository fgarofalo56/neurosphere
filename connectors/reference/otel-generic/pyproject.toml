[project]
name = "neurosphere-connector-otel-generic"
version = "0.0.0"
description = "Reference push connector: OpenTelemetry spans/metrics and CloudEvents to TelemetryEvent envelopes at the ingest edge (PRP-09 item 3)."
requires-python = ">=3.12"
dependencies = [
  "neurosphere-connector",
  "httpx>=0.28,<0.29",
]

[tool.uv.sources]
neurosphere-connector = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurosphere_connector_otel_generic"]
