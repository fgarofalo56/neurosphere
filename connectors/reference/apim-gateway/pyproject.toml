[project]
name = "neurosphere-connector-apim-gateway"
version = "0.0.0"
description = "APIM AI gateway write connector: digest-bound publish plans applied in dependency order with ownership, reverse rollback and read-back verify (PRP-34 item 1)."
requires-python = ">=3.12"
dependencies = [
  "neurosphere-connector",
  "httpx>=0.28,<0.29",
]

[tool.uv.sources]
neurosphere-connector = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurosphere_connector_apim_gateway"]
