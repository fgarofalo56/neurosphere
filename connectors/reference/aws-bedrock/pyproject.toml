[project]
name = "neurosphere-connector-aws-bedrock"
version = "0.0.0"
description = "Reference AWS Bedrock metadata connector: inventory, CloudWatch usage, Cost Explorer cost, invocation-logging setting (PRP-62)."
requires-python = ">=3.12"
dependencies = [
  "neurosphere-connector",
  "boto3>=1.44,<2",
]

[tool.uv.sources]
neurosphere-connector = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurosphere_connector_aws_bedrock"]
