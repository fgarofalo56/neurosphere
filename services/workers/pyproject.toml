[project]
name = "neurosphere-workers"
version = "0.0.0"
description = "NeuroSphere background workers (ingestion, projection). Must never depend on neurosphere-api."
requires-python = ">=3.12"
dependencies = [
  "neurosphere-core",
  "pydantic>=2.14,<3",
]

[tool.uv.sources]
neurosphere-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurosphere_workers"]
