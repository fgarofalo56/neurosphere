[project]
name = "neurosphere-workers"
version = "0.0.0"
description = "NeuroSphere background workers (ingestion, projection). Must never depend on neurosphere-api."
requires-python = ">=3.12"
dependencies = [
  "neurosphere-core",
  "neurosphere-connector",
  "neurosphere-connector-azure-monitor",
  "pydantic>=2.14,<3",
  "aiohttp>=3.9,<4",
  "httpx>=0.28,<0.29",
]

[tool.uv.sources]
neurosphere-core = { workspace = true }
neurosphere-connector = { workspace = true }
neurosphere-connector-azure-monitor = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurosphere_workers"]
