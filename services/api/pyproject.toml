[project]
name = "neurosphere-api"
version = "0.0.0"
description = "NeuroSphere REST/WebSocket API service. Stub until PRP-05."
requires-python = ">=3.12"
dependencies = [
  "neurosphere-core",
  "neurosphere-connector",
  "neurosphere-workers",
  "fastapi>=0.143,<0.144",
  "pydantic>=2.14,<3",
  "uvicorn>=0.54,<0.55",
  "httpx>=0.28,<0.29",
  "mcp>=2.3,<2.4",
]

[tool.uv.sources]
neurosphere-core = { workspace = true }
neurosphere-connector = { workspace = true }
neurosphere-workers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurosphere_api"]
