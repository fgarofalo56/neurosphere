[project]
name = "neurosphere-docs-assistant"
version = "0.0.0"
description = "Public docs assistant: read-only, rate-limited Q&A over the built docs site artifact. Must never depend on neurosphere-api or neurosphere-core."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143,<0.150",
  "uvicorn>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docs_assistant"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
