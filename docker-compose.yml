# Local development stack: Azure emulators only. No paid or external calls.
# Application services (api, workers, frontend) are added by PRP-05 (profile `app`).
#
# Profiles:
#   (default)  cosmos, azurite, eventhubs
#   test       adds `egress-probe` on an `internal: true` network (no route out) that
#              can still reach the emulators by service name. Run the probe with:
#                docker compose --profile test up -d --wait
#   app        reserved for PRP-05 (see commented block at the bottom)
#
# Emulator limits that matter (see docs/RESEARCH-AND-GATES.md G12):
#   cosmos    - vNext Linux emulator: no auth enforcement, no sprocs/triggers/UDF,
#               no range/composite/spatial indexes, no RU accounting.
#   eventhubs - SAS auth only (no Entra), 1 namespace / 10 hubs, no persistence
#               across restarts, requires Azurite for checkpoints/metadata.
#   azurite   - Blob + Queue GA; Table preview; no ADLS Gen2.
name: neurosphere

services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    ports:
      - "8081:8081"
    environment:
      PROTOCOL: http
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
    networks: [default, isolated]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    networks: [default, isolated]

  eventhubs:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    depends_on:
      azurite:
        condition: service_healthy
    volumes:
      - ./infra/compose/eventhubs.config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "9092:9092"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "Y"   # Microsoft emulator EULA; required by the image
    networks: [default, isolated]

  # The Event Hubs emulator image ships no shell or curl, so an in-container healthcheck
  # is impossible. This sidecar probes its AMQP port over the compose network instead;
  # `up --wait` therefore gates on it.
  eventhubs-health:
    image: busybox:latest
    command: ["sleep", "infinity"]
    depends_on:
      - eventhubs
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 eventhubs 5672 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  # Probe for the egress-blocked network. Lives only on `isolated`, which is
  # `internal: true`, so it has no route to anything outside the compose project.
  egress-probe:
    profiles: [test]
    image: busybox:latest
    command: ["sleep", "infinity"]
    networks: [isolated]
    depends_on:
      cosmos:
        condition: service_healthy
      azurite:
        condition: service_healthy
      eventhubs-health:
        condition: service_healthy

networks:
  default: {}
  isolated:
    internal: true

