[project]
name = "neurosphere-workspace"
version = "0.0.0"
description = "NeuroSphere workspace root: shared tooling, planning validation and cross-package tests."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }

# Not a distributable package. Product packages live under packages/* and
# services/* and are added as uv workspace members by PRP-00.
[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.16,<0.17",
  "pyright>=1.1.400,<2",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "respx>=0.23,<0.24",
  "httpx>=0.28,<0.29",
  "pip-audit>=2.10,<3",
  "hypothesis>=6.168,<7",
  "azure-cosmos>=4.6,<5",
  "azure-eventhub>=5.12,<6",
  "azure-identity>=1.26,<2",
  "neurosphere-core",
  "neurosphere-contracts",
  "neurosphere-api",
  "neurosphere-workers",
  "neurosphere-connector",
  "neurosphere-connector-otel-generic",
  "neurosphere-connector-azure-monitor",
  "neurosphere-connector-foundry",
  "neurosphere-connector-foundry-actions",
  "neurosphere-connector-azure-billing",
]

[tool.uv.sources]
neurosphere-core = { workspace = true }
neurosphere-contracts = { workspace = true }
neurosphere-api = { workspace = true }
neurosphere-workers = { workspace = true }
neurosphere-connector = { workspace = true }
neurosphere-connector-otel-generic = { workspace = true }
neurosphere-connector-azure-monitor = { workspace = true }
neurosphere-connector-foundry = { workspace = true }
neurosphere-connector-foundry-actions = { workspace = true }
neurosphere-connector-azure-billing = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/*",
  "packages/contracts/python",
  "services/*",
  "connectors/sdk-python",
  "connectors/reference/*",
]
exclude = ["packages/contracts"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "PRPs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "ASYNC", "RUF"]
ignore = ["S101"]  # assert is the test idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["scripts", "tests", "packages", "services", "sandbox", "connectors"]
exclude = ["**/node_modules", "**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services", "connectors"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m \"not integration and not live\""
markers = [
  "live: requires an operator-approved Azure environment (NS_LIVE_APPROVED=1)",
  "integration: requires the docker compose emulators",
]
