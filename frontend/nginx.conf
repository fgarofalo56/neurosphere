# Unprivileged static server for the SPA. Every writable path is under /tmp so the
# container runs with readOnlyRootFilesystem and /tmp as an emptyDir/tmpfs.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The server block lives in nginx/templates/default.conf.template and is rendered at start
    # (envsubst of NS_UI_API_UPSTREAM) into NGINX_ENVSUBST_OUTPUT_DIR.
    include /tmp/ns-conf.d/*.conf;
}
