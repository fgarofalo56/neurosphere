# NeuroSphere documentation site. Tool choice: docs/adr/0008-docs-site-tool.md.
# Build: uv run --no-project --with mkdocs-material==9.8.0 mkdocs build --strict --site-dir temp/site
site_name: NeuroSphere
site_description: Customer-hosted AI governance documentation
site_url: https://fgarofalo56.github.io/neurosphere/
docs_dir: docs
site_dir: temp/site
strict: true

repo_url: https://github.com/fgarofalo56/neurosphere
repo_name: fgarofalo56/neurosphere
edit_uri: ""

theme:
  name: material
  logo: assets/brand/neurosphere-tile.svg
  favicon: assets/brand/neurosphere-tile.svg
  icon:
    repo: fontawesome/brands/github
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

# Brand palette from frontend/src/design-system/tokens/brand.ts. Served from docs/assets/,
# which is re-included below so the theme's own CSS and JS are published too.
extra_css:
  - assets/stylesheets/neurosphere.css

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# Link check: strict mode turns each of these warnings into a build failure.
validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Publish allowlist, part 1: files outside this set are not built into the site at all
# (gitignore syntax). Everything at the top of docs/ is excluded, then only the adopter
# set is re-included. docs/evidence/, docs/validation/, docs/design/, docs/PRD.md,
# docs/DECISIONS-LOG.md and the rest of docs/security/ and docs/compliance/ stay
# unpublished. Keep this in step with `nav` below; tests/docs/test_nav_allowlist.py
# enforces it.
# `/*` also matches files the theme contributes, so `!/assets/` must stay: without it
# Material's CSS and JS are dropped and the site renders unstyled (shipped that way
# until 2026-11-14). docs/assets/ holds only brand files and the extra stylesheet.
exclude_docs: |
  /*
  !/index.md
  !/assets/
  !/adr/
  !/runbooks/
  !/walkthroughs/
  !/reference/
  /reference/*
  !/reference/*.md
  !/ARCHITECTURE.md
  !/RESEARCH-AND-GATES.md
  !/dev/
  !/ops/
  !/release/
  /release/dod-checklist.md
  !/connectors/
  !/deploy/
  !/security/
  /security/*
  !/security/runbooks/
  !/compliance/
  /compliance/*
  !/compliance/plans/
  __pycache__/

# Publish allowlist, part 2: explicit nav. Add pages here deliberately.
