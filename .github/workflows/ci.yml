name: CI

# Every gate here fails loudly. No step may suppress a failing exit code; the
# planning validator and the step below check for that in this directory. The
# only allowed form is a no-match grep inside a command substitution, marked
# with a `no-match-ok` comment on the same line.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff, pyright, pytest, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --frozen --group dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest -q
      - name: Dependency audit
        # Workspace members are not on PyPI, so audit the exported third-party pins only.
        run: |
          uv export --frozen --group dev --no-emit-workspace --no-hashes -o requirements-audit.txt
          uv run pip-audit --strict --progress-spinner off --no-deps --disable-pip -r requirements-audit.txt

  frontend:
    name: frontend (lint, typecheck, vitest, audit)
    runs-on: ubuntu-latest
    # Ran ~10.5 min on PR #87 and hit the old 15-min cap on a slow runner for PR #88.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Detect frontend workspace
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "frontend/ not scaffolded yet (PRP-04); nothing to run"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm lint
      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: pnpm typecheck
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: pnpm test
      - name: Install Playwright browser
        if: steps.detect.outputs.present == 'true'
        run: pnpm --filter @neurosphere/frontend exec playwright install --with-deps chromium
      - name: E2E (mock API, stubbed sign-in)
        if: steps.detect.outputs.present == 'true'
        # test:e2e is pinned to the chromium project; the pixel-comparison `visual` project is
        # excluded on the bare runner and runs in the pinned image in the next step.
        run: pnpm --filter @neurosphere/frontend test:e2e
      - name: Visual regression (pinned Playwright image, compare only)
        if: steps.detect.outputs.present == 'true'
        # Baselines were generated in mcr.microsoft.com/playwright:v<@playwright/test>-noble
        # (frontend/scripts/update-visual-baselines.mjs); the same image renders them here.
        run: pnpm --filter @neurosphere/frontend visual:check
      - name: Audit
        if: steps.detect.outputs.present == 'true'
        run: pnpm audit --audit-level high

  planning:
    name: planning docs aligned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Validate planning artefacts
        run: python scripts/validate_planning.py
      # The licence register reads licences from installed metadata (no network lookups), so
      # the toolchains and both dependency trees must be present first.
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Licence register is current, no UNKNOWN or unapproved non-permissive licence
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile
          python scripts/licenses_report.py --check
      - name: Workflows contain no suppressed failures
        run: |
          if grep -rnE '\|\|[[:space:]]*true' .github/workflows | grep -v 'no-match-ok'; then
            echo "::error::a workflow suppresses a failing exit code"
            exit 1
          fi
          echo "OK"

  bicep:
    name: bicep build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build every Bicep file and param file, lint the root template
        run: |
          az bicep install
          rc=0
          while IFS= read -r f; do
            echo "build $f"
            az bicep build --file "$f" --stdout > /dev/null || rc=1
          done < <(find infra -name '*.bicep' | sort)
          while IFS= read -r p; do
            echo "build-params $p"
            az bicep build-params --file "$p" --stdout > /dev/null || rc=1
          done < <(find infra -name '*.bicepparam' | sort)
          az bicep lint --file infra/bicep/modules/main.bicep || rc=1
          exit $rc

  helm:
    name: helm 4 lint and template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Helm major version is 4
        run: |
          helm version --short
          helm version --short | grep -E '^v4[.]'
      - name: Lint (strict)
        run: helm lint --strict infra/helm -f infra/helm/ci/values-ci.yaml
      - name: Template renders
        run: helm template neurosphere infra/helm -f infra/helm/ci/values-ci.yaml > /dev/null

  mermaid:
    name: mermaid diagrams render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # --no-sandbox is passed deliberately: GitHub-hosted runners disable the unprivileged
      # user namespaces Chromium's sandbox needs. The job renders only our own committed
      # Markdown on a throwaway runner. Any parser error makes the script exit non-zero.
      # mermaid-cli 12.0.0 floats its puppeteer dependency, and each puppeteer release wants a
      # different downloaded browser build. Use the runner's preinstalled Chrome instead, so
      # the job does not depend on which puppeteer version resolves today.
      - name: Render docs/ARCHITECTURE.md diagrams (fails on parser error)
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: python scripts/render_mermaid.py --no-sandbox
