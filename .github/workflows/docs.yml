name: docs

# PRP-25 item 1. Tool choice and commands: docs/adr/0008-docs-site-tool.md.
# Pull requests build (strict mode plus link validation) and never deploy.
# A push to the default branch builds and deploys to GitHub Pages via Actions.
# No secrets are used. Actions are pinned by major tag, as in ci.yml.
on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build docs (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build in strict mode (validates internal links, images and anchors)
        run: uv run --no-project --with mkdocs-material==9.8.0 mkdocs build --strict --site-dir temp/site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: temp/site

  deploy:
    name: deploy to Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
