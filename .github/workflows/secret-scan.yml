name: secret-scan

# The local .githooks guard can be bypassed with --no-verify and only runs on one
# machine. This workflow is the enforcement that holds the line. The repo is
# private, but a push is still publication: anything that reaches the remote is
# treated as compromised and must be rotated before history is cleaned.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"   # weekly full-history re-scan with newer rules
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks binary (digest pinned)
        # The MIT gitleaks binary, not gitleaks-action: the action needs a licence
        # key on organisation repos and this job must keep working if the repo moves.
        run: |
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tgz}" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --verbose --exit-code 1

  blocked-paths:
    name: no credential-shaped files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail if a credential file is tracked
        run: |
          bad=$(git ls-files | grep -iE '(^|/)\.env($|\.)|\.pem$|\.key$|\.pfx$|\.p12$|credentials\.json$|service-account.*\.json$|(^|/)secrets/' | grep -v '^\.env\.example$' || true)  # no-match-ok: grep exits 1 when the tree is clean
          if [ -n "$bad" ]; then
            echo "::error::credential-shaped files are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "OK: no credential-shaped files tracked"

  pii-scan:
    name: no PII in the repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scan for SSN / card numbers
        run: |
          hits=$(git grep -nIE '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b|\b4[0-9]{12}([0-9]{3})?\b' -- . \
                 ':(exclude).githooks/*' ':(exclude).github/workflows/*' ':(exclude).gitleaks.toml' || true)  # no-match-ok: grep exits 1 when the tree is clean
          if [ -n "$hits" ]; then
            echo "::error::possible PII committed:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no PII patterns found"
