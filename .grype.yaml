# Grype accepted-risk list. Every entry needs a reason, a date and a re-check trigger.
# Scope each rule to one package so a new finding in another package still fails the gate.
#
# Empty on purpose. The four sqlite-libs CVEs that were ignored here (added 2026-11-04) are no
# longer accepted: PRP-52 (#171) makes the sqlite3 import in neurosphere_core's analytics stub
# lazy and removes the sqlite-libs apk from the final stage of the api, workers and
# docs-assistant images, so the package is not in the images any more. Do not re-add a
# sqlite-libs rule: if sqlite3 is needed again, fix it in the image, not here.
#
# picomatch <= 4.0.7 ReDoS, accepted 2026-11-17 by the owner until 2026-12-17: no fixed version
# exists; dev tooling only (eslint, vite, vitest via tinyglobby), not in any image. Grype has no
# expiry field: the expiry is enforced by .trivyignore (exp:2026-12-17), which fails the same
# job again after that date. Re-check when picomatch publishes a fix, then delete both rules,
# the .trivyignore line and the pnpm auditConfig entry.
ignore:
  - vulnerability: GHSA-fc5q-39xc-vjpf
    package:
      name: picomatch
  - vulnerability: CVE-2026-112366
    package:
      name: picomatch
