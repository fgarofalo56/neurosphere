{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "neurosphere.serviceAccountName" . }}
  labels:
    {{- include "neurosphere.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "serviceAccount.workloadIdentity.clientId is required" .Values.serviceAccount.workloadIdentity.clientId | quote }}
    {{- with .Values.serviceAccount.workloadIdentity.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
