{{- if .Values.secretProviderClass.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-vault
  labels:
    {{- include "neurosphere.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: {{ .Values.secretProviderClass.usePodIdentity | quote }}
    clientID: {{ required "serviceAccount.workloadIdentity.clientId is required" .Values.serviceAccount.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "secretProviderClass.keyVaultName is required" .Values.secretProviderClass.keyVaultName | quote }}
    tenantId: {{ required "secretProviderClass.tenantId is required" .Values.secretProviderClass.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.secretProviderClass.objects }}
        - |
          objectName: {{ .name }}
          objectType: {{ .type | default "secret" }}
        {{- end }}
{{- end }}
