{{- range $name := list "api" "workers" "frontend" }}
{{- $c := index $.Values $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "neurosphere.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "neurosphere.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        {{- if $.Values.serviceAccount.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "neurosphere.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.workloadIdentity.enabled }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "neurosphere.image" (list $ $c) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $c.port }}
          {{- $apimFront := and (eq $name "api") $.Values.mcp.apimFront.enabled }}
          {{- $ingestFile := "" }}
          {{- if eq $name "api" }}
          {{- if and $.Values.ingest.producersFile $.Values.ingest.producersConfigMap }}
          {{- fail "set only one of ingest.producersFile or ingest.producersConfigMap" }}
          {{- end }}
          {{- if $.Values.ingest.producersConfigMap }}
          {{- $ingestFile = "/etc/neurosphere/ingest/producers.json" }}
          {{- else }}
          {{- $ingestFile = $.Values.ingest.producersFile }}
          {{- end }}
          {{- end }}
          {{- $scan := and (eq $name "api") $.Values.scan.enabled }}
          {{- $deployApply := and (eq $name "api") $.Values.deployApply.enabled }}
          {{- $search := and (eq $name "api") $.Values.search.provider }}
          {{- $evalApi := and (eq $name "api") $.Values.evaluation.pilotDatasetIds }}
          {{- $evalWorker := and (eq $name "workers") (or $.Values.workers.roles $.Values.evaluation.dataDir) }}
          {{- if or $.Values.env $apimFront $ingestFile $scan $deployApply $search $evalApi $evalWorker }}
          env:
            {{- range $k, $v := $.Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if $ingestFile }}
            # Producer registry (digests only). Unset: ingest stays 503 ingest_not_configured.
            - name: NS_INGEST_PRODUCERS_FILE
              value: {{ $ingestFile | quote }}
            {{- end }}
            {{- if $scan }}
            # Opt-in resource scan; unset keeps POST /v1/deploy/scan failing closed (503).
            - name: NS_SCAN_ENABLED
              value: "true"
            {{- with $.Values.scan.requestTimeoutSeconds }}
            - name: NS_SCAN_REQUEST_TIMEOUT_SECONDS
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.scan.pageSize }}
            - name: NS_SCAN_PAGE_SIZE
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.scan.maxPages }}
            - name: NS_SCAN_MAX_PAGES
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.scan.maxSubscriptions }}
            - name: NS_SCAN_MAX_SUBSCRIPTIONS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if $deployApply }}
            # Opt-in deploy apply / uninstall preview; unset keeps /api/v1/deploy/apply failing closed (503).
            - name: NS_DEPLOY_APPLY_ENABLED
              value: "true"
            {{- with $.Values.deployApply.registerContainer }}
            - name: NS_DEPLOY_APPLY_REGISTER_CONTAINER
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if $search }}
            # Catalog search; unset provider keeps catalog search failing closed (503 search_unavailable).
            - name: NS_SEARCH_PROVIDER
              value: {{ $.Values.search.provider | quote }}
            {{- with $.Values.search.service }}
            - name: NS_SEARCH_SERVICE
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.search.index }}
            - name: NS_SEARCH_INDEX
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.search.region }}
            - name: NS_SEARCH_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if $evalApi }}
            # Evaluation pilot datasets read by /quality (names only).
            - name: NS_EVALUATION_PILOT_DATASET_IDS
              value: {{ $.Values.evaluation.pilotDatasetIds | quote }}
            {{- end }}
            {{- if eq $name "workers" }}
            {{- with $.Values.workers.roles }}
            - name: NS_WORKER_ROLES
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.evaluation.dataDir }}
            # SYNTHETIC benchmark registry baked into the workers image.
            - name: NS_WORKER_EVAL_DATA_DIR
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.evaluation.judge }}
            - name: NS_WORKER_EVAL_JUDGE
              value: {{ . | quote }}
            {{- end }}
            {{- if and $.Values.evaluation.pilotDomainId $.Values.evaluation.pilotSubjectId }}
            - name: NS_WORKER_EVAL_PILOT_DATASET_IDS
              value: {{ $.Values.evaluation.pilotDatasetIds | quote }}
            - name: NS_WORKER_EVAL_PILOT_DOMAIN_ID
              value: {{ $.Values.evaluation.pilotDomainId | quote }}
            - name: NS_WORKER_EVAL_PILOT_SUBJECT_ID
              value: {{ $.Values.evaluation.pilotSubjectId | quote }}
            {{- end }}
            {{- end }}
            {{- if $apimFront }}
            # PRM resource identifier must equal the URL clients reach through the gateway.
            - name: NS_MCP_RESOURCE_SERVER_URL
              value: {{ printf "https://%s/mcp" (required "mcp.apimFront.gatewayHost is required when mcp.apimFront.enabled" $.Values.mcp.apimFront.gatewayHost) | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $c.probes.readiness }}
              port: http
          livenessProbe:
            httpGet:
              path: {{ $c.probes.liveness }}
              port: http
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $name "frontend" }}
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            {{- end }}
            {{- if $.Values.secretProviderClass.enabled }}
            - name: vault
              mountPath: /mnt/vault
              readOnly: true
            {{- end }}
            {{- if and (eq $name "api") $.Values.ingest.producersConfigMap }}
            - name: ingest-producers
              mountPath: /etc/neurosphere/ingest
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $name "frontend" }}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        {{- end }}
        {{- if $.Values.secretProviderClass.enabled }}
        - name: vault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ $.Release.Name }}-vault
        {{- end }}
        {{- if and (eq $name "api") $.Values.ingest.producersConfigMap }}
        - name: ingest-producers
          configMap:
            name: {{ $.Values.ingest.producersConfigMap | quote }}
        {{- end }}
{{- end }}
