{{- range $name := list "api" "workers" "frontend" }}
{{- $c := index $.Values $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "neurosphere.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "neurosphere.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        {{- if $.Values.serviceAccount.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "neurosphere.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.workloadIdentity.enabled }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "neurosphere.image" (list $ $c) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $c.port }}
          {{- $apimFront := and (eq $name "api") $.Values.mcp.apimFront.enabled }}
          {{- if or $.Values.env $apimFront }}
          env:
            {{- range $k, $v := $.Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if $apimFront }}
            # PRM resource identifier must equal the URL clients reach through the gateway.
            - name: NS_MCP_RESOURCE_SERVER_URL
              value: {{ printf "https://%s/mcp" (required "mcp.apimFront.gatewayHost is required when mcp.apimFront.enabled" $.Values.mcp.apimFront.gatewayHost) | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $c.probes.readiness }}
              port: http
          livenessProbe:
            httpGet:
              path: {{ $c.probes.liveness }}
              port: http
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $name "frontend" }}
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            {{- end }}
            {{- if $.Values.secretProviderClass.enabled }}
            - name: vault
              mountPath: /mnt/vault
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $name "frontend" }}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        {{- end }}
        {{- if $.Values.secretProviderClass.enabled }}
        - name: vault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ $.Release.Name }}-vault
        {{- end }}
{{- end }}
