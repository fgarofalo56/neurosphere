# NeuroSphere chart values. Helm 4 (ADR-0002).
#
# Extension points owned by later PRPs (do not add them here):
#   - values-government.yaml (cloud-specific values)  -> PRP-20
#   - templates/networkpolicy.yaml                    -> PRP-12
#
# SINGLE SOURCE FOR IMAGE REFERENCES: image.registry, image.tag and each
# component's repository. infra/appservice/main.bicepparam MUST carry identical
# values; tests/unit/infra/test_helm_render.py proves the resolved strings match.
# Nothing cloud-specific is baked in: registry has no default and is `required`.

image:
  registry: "" # required, supplied by the deployment profile
  tag: "" # required
  pullPolicy: IfNotPresent
  pullSecrets: [] # names of pre-existing image pull secrets (never inline credentials)

serviceAccount:
  create: true
  # Azure workload identity. Client id is an identifier, not a secret.
  workloadIdentity:
    enabled: true
    clientId: "" # required when enabled
    tenantId: "" # optional; adds azure.workload.identity/tenant-id

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

# Non-secret environment only. Credentials come from vault references
# (secretProviderClass below), never from values.
# env.NS_CLOUD is REQUIRED (commercial or government): the chart refuses to render without it so
# a deployment never silently assumes a cloud. Example: `--set env.NS_CLOUD=commercial`.
env: {}

# Ingest producer registry (sha256 digests only, never plaintext secrets). Off by default: ingest
# routes answer 503 ingest_not_configured and /readyz reports composition.ingest.disabled.
# Set exactly one source (see docs/runbooks/ingest.md):
#   ingest.producersFile: path inside the api pod, e.g. a vault object mounted by
#     secretProviderClass at /mnt/vault/<object name> (add the object to secretProviderClass.objects);
#   ingest.producersConfigMap: name of an operator-created ConfigMap with key producers.json,
#     mounted read-only into the api pod.
#   ingest.producerStore: true (PRP-41, NS_INGEST_PRODUCER_STORE) also reads producers created in
#     the admin console from the store; it can be combined with either source above.
ingest:
  producersFile: ""
  producersConfigMap: ""
  producerStore: false

# Per-domain admission control (PRP-21). Off by default (no env set). Set exactly one source and the
# api gets NS_ADMISSION_ENABLED=true plus NS_ADMISSION_POLICY_FILE (see docs/runbooks/admission-and-federation.md):
#   admission.policyFile: path inside the api pod (e.g. a vault object under /mnt/vault);
#   admission.policyConfigMap: operator-created ConfigMap with key quotas.json, mounted read-only.
# Never unlimited: an unreadable file falls back to 10 req/s, burst 20 per domain.
admission:
  policyFile: ""
  policyConfigMap: ""

# Deployment resource scan (PRP-08). Off by default: POST /v1/deploy/scan answers 503
# scan_not_configured. When enabled the api container gets NS_SCAN_ENABLED=true and reads
# Resource Graph with its workload identity (keyless). Tuning keys are optional; empty = service default.
scan:
  enabled: false
  requestTimeoutSeconds: "" # NS_SCAN_REQUEST_TIMEOUT_SECONDS
  pageSize: "" # NS_SCAN_PAGE_SIZE (1..1000)
  maxPages: "" # NS_SCAN_MAX_PAGES
  maxSubscriptions: "" # NS_SCAN_MAX_SUBSCRIPTIONS (1..1000)

# Deployment apply + uninstall preview (PRP-08 item 14). Off by default: /api/v1/deploy/apply
# answers 503 apply_not_configured and deploy intents stay advisory. When enabled the api
# container gets NS_DEPLOY_APPLY_ENABLED=true; registerContainer names the Cosmos container of the
# ownership register (NS_DEPLOY_APPLY_REGISTER_CONTAINER, required for the API to wire it).
# Names only: no secret. The apply approval store is per API process and the executor worker
# does not register the deploy connector until a durable approval store exists.
deployApply:
  enabled: false
  registerContainer: ""

# Write targets (PRP-54). Everything is off by default: the write registry stays empty and a dry
# run reports "no write target". fromStore sets NS_WRITE_TARGETS_FROM_STORE on the api and workers
# so the stored write_targets entries (console) define the targets; foundry and apim are the env
# fallback (NS_FOUNDRY_* / NS_APIM_*), rendered only when enabled. Names and ids only, no secret;
# auth is the workload identity, whose write role assignments are operator-owned
# (docs/runbooks/write-targets.md).
writeTargets:
  fromStore: false
  foundry:
    enabled: false
    subscriptionId: ""
    resourceGroup: ""
    account: ""
    location: ""
  apim:
    enabled: false
    gatewayId: ""
    domainId: ""

# Catalog search (PRP-10 item 11) on the api container only. provider: fixture (in-process index,
# the default) | azure (Azure AI Search via workload identity; set service and region) | "" (unset:
# catalog search answers 503 search_unavailable). Names only: no key, connection string or host
# (the host comes from the cloud profile in code). In a Government cloud, provider azure with a
# disabled capability row or no service fails the catalog readiness check instead of falling back.
search:
  provider: fixture
  service: "" # NS_SEARCH_SERVICE
  index: "" # NS_SEARCH_INDEX (empty = neurosphere-catalog)
  region: "" # NS_SEARCH_REGION

# Evaluation (PRP-16). The workers image carries the SYNTHETIC benchmark registry at
# /app/evaluation-data; the fixture judge replays recorded verdicts (no model call). The offline
# pilot stays idle unless BOTH pilotDomainId and pilotSubjectId are set (canonical ids inside the
# worker identity scope); empty values are not rendered. Names and ids only.
evaluation:
  dataDir: /app/evaluation-data # NS_WORKER_EVAL_DATA_DIR (workers)
  judge: fixture # NS_WORKER_EVAL_JUDGE: fixture | endpoint
  pilotDatasetIds: "sbx-groundedness-pilot" # NS_EVALUATION_PILOT_DATASET_IDS (api), NS_WORKER_EVAL_PILOT_DATASET_IDS (workers)
  pilotDomainId: "" # NS_WORKER_EVAL_PILOT_DOMAIN_ID
  pilotSubjectId: "" # NS_WORKER_EVAL_PILOT_SUBJECT_ID

# Secrets Store CSI driver + Key Vault + workload identity (optional, off by default).
secretProviderClass:
  enabled: false
  keyVaultName: "" # required when enabled
  tenantId: "" # required when enabled
  usePodIdentity: "false"
  # Vault objects to mount: list of {name, type} (type: secret|key|cert). References only.
  objects: []

ingress:
  enabled: false
  className: ""
  host: "" # required when enabled
  tls:
    enabled: false
    secretName: "" # pre-existing TLS secret name

# PRP-12: default-deny ingress and egress for the release's pods, plus explicit allows.
# NetworkPolicy has no FQDN support, so egress is by CIDR and port only.
networkPolicy:
  enabled: true
  dns:
    namespaceLabels:
      kubernetes.io/metadata.name: kube-system
    podLabels:
      k8s-app: kube-dns
  # Namespace of the ingress controller; used only when ingress.enabled.
  ingressController:
    namespaceLabels:
      kubernetes.io/metadata.name: ingress-nginx
  # Egress allowlist: list of {name, cidr, ports: [{port, protocol}]}. Typical entry is the
  # private-endpoint subnet range from the network Bicep module (443/TCP). Empty = DNS and
  # intra-release traffic only.
  #
  # Egress that workload identity and Azure Monitor need (NetworkPolicy cannot match FQDNs, so
  # resolve the endpoints for your cloud and region and list their CIDRs):
  #   - the Microsoft Entra ID token endpoint of your cloud (Commercial or Government; look it up
  #     with `az cloud show`) on 443/TCP, for workload identity token exchange;
  #   - Azure Monitor / Application Insights ingestion and the Log Analytics workspace
  #     (the AzureMonitor service tag ranges) on 443/TCP, or the private-endpoint subnet when Azure
  #     Monitor Private Link is used.
  # Copy-paste example (replace the placeholder CIDRs with your own):
  #   egressAllowlist:
  #     - name: entra-id
  #       cidr: 203.0.113.0/24   # documentation range; use the Entra ID service tag CIDRs
  #       ports:
  #         - port: 443
  #           protocol: TCP
  #     - name: azure-monitor
  #       cidr: 198.51.100.0/24  # documentation range; use the AzureMonitor service tag CIDRs
  #       ports:
  #         - port: 443
  #           protocol: TCP
  egressAllowlist: []

api:
  replicas: 2
  repository: neurosphere/api
  port: 8000
  probes:
    readiness: /readyz
    liveness: /healthz
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

workers:
  replicas: 1
  repository: neurosphere/workers
  port: 8090
  # NS_WORKER_ROLES. Empty = unset (idle), the chart's historical default; set it explicitly to run
  # roles, e.g. the hosted demo list
  # "ingestion,projections,aggregates,actions,hitl_timers,lifecycle,evaluation".
  # PRP-58: a YAML list of role names is accepted too (joined with commas). The connector roles
  # gateway_poll, foundry_discovery and billing_export are never on by default; add them here
  # once stored connector configuration (PRP-42) and the workload identity roles exist.
  roles: ""
  # NS_WORKER_CONNECTOR_CONFIG_SOURCE (PRP-42): "auto" reads stored connector config through the
  # API. Empty = unset (the worker default).
  connectorConfigSource: ""
  # NS_API_BASE_URL: where connector roles post telemetry, e.g. the in-cluster API service URL.
  # Empty = unset.
  apiBaseUrl: ""
  recommendations:
    # NS_WORKER_REC_SOURCE (PRP-15): "archive" reads the lakehouse archive. Empty = unset
    # (sandbox files via NS_WORKER_REC_DATA_DIR). The role itself is enabled through workers.roles.
    source: ""
  probes:
    readiness: /healthz
    liveness: /healthz
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

frontend:
  replicas: 2
  repository: neurosphere/frontend
  port: 8080 # unprivileged static server
  probes:
    readiness: /
    liveness: /
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# PRP-34: publish NeuroSphere's own MCP server through a customer API Management gateway.
# Off by default. When enabled, the API's NS_MCP_RESOURCE_SERVER_URL becomes
# https://<gatewayHost>/mcp so the RFC 9728 resource identifier equals the gateway URL.
mcp:
  apimFront:
    enabled: false
    gatewayHost: "" # required when enabled; host only, no scheme (the gateway host of the created APIM)
