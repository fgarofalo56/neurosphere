# NeuroSphere chart values. Helm 4 (ADR-0002).
#
# Extension points owned by later PRPs (do not add them here):
#   - values-government.yaml (cloud-specific values)  -> PRP-20
#   - templates/networkpolicy.yaml                    -> PRP-12
#
# SINGLE SOURCE FOR IMAGE REFERENCES: image.registry, image.tag and each
# component's repository. infra/appservice/main.bicepparam MUST carry identical
# values; tests/unit/infra/test_helm_render.py proves the resolved strings match.
# Nothing cloud-specific is baked in: registry has no default and is `required`.

image:
  registry: "" # required, supplied by the deployment profile
  tag: "" # required
  pullPolicy: IfNotPresent
  pullSecrets: [] # names of pre-existing image pull secrets (never inline credentials)

serviceAccount:
  create: true
  # Azure workload identity. Client id is an identifier, not a secret.
  workloadIdentity:
    enabled: true
    clientId: "" # required when enabled
    tenantId: "" # optional; adds azure.workload.identity/tenant-id

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

# Non-secret environment only. Credentials come from vault references
# (secretProviderClass below), never from values.
env: {}

# Ingest producer registry (sha256 digests only, never plaintext secrets). Off by default: ingest
# routes answer 503 ingest_not_configured and /readyz reports composition.ingest.disabled.
# Set exactly one source (see docs/runbooks/ingest.md):
#   ingest.producersFile: path inside the api pod, e.g. a vault object mounted by
#     secretProviderClass at /mnt/vault/<object name> (add the object to secretProviderClass.objects);
#   ingest.producersConfigMap: name of an operator-created ConfigMap with key producers.json,
#     mounted read-only into the api pod.
ingest:
  producersFile: ""
  producersConfigMap: ""

# Deployment resource scan (PRP-08). Off by default: POST /v1/deploy/scan answers 503
# scan_not_configured. When enabled the api container gets NS_SCAN_ENABLED=true and reads
# Resource Graph with its workload identity (keyless). Tuning keys are optional; empty = service default.
scan:
  enabled: false
  requestTimeoutSeconds: "" # NS_SCAN_REQUEST_TIMEOUT_SECONDS
  pageSize: "" # NS_SCAN_PAGE_SIZE (1..1000)
  maxPages: "" # NS_SCAN_MAX_PAGES
  maxSubscriptions: "" # NS_SCAN_MAX_SUBSCRIPTIONS (1..1000)

# Deployment apply + uninstall preview (PRP-08 item 14). Off by default: /api/v1/deploy/apply
# answers 503 apply_not_configured and deploy intents stay advisory. When enabled the api
# container gets NS_DEPLOY_APPLY_ENABLED=true; registerContainer names the Cosmos container of the
# ownership register (NS_DEPLOY_APPLY_REGISTER_CONTAINER, required for the API to wire it).
# Names only: no secret. The apply approval store is per API process and the executor worker
# does not register the deploy connector until a durable approval store exists.
deployApply:
  enabled: false
  registerContainer: ""

# Catalog search (PRP-10 item 11) on the api container only. provider: fixture (in-process index,
# the default) | azure (Azure AI Search via workload identity; set service and region) | "" (unset:
# catalog search answers 503 search_unavailable). Names only: no key, connection string or host
# (the host comes from the cloud profile in code). In a Government cloud, provider azure with a
# disabled capability row or no service fails the catalog readiness check instead of falling back.
search:
  provider: fixture
  service: "" # NS_SEARCH_SERVICE
  index: "" # NS_SEARCH_INDEX (empty = neurosphere-catalog)
  region: "" # NS_SEARCH_REGION

# Secrets Store CSI driver + Key Vault + workload identity (optional, off by default).
secretProviderClass:
  enabled: false
  keyVaultName: "" # required when enabled
  tenantId: "" # required when enabled
  usePodIdentity: "false"
  # Vault objects to mount: list of {name, type} (type: secret|key|cert). References only.
  objects: []

ingress:
  enabled: false
  className: ""
  host: "" # required when enabled
  tls:
    enabled: false
    secretName: "" # pre-existing TLS secret name

# PRP-12: default-deny ingress and egress for the release's pods, plus explicit allows.
# NetworkPolicy has no FQDN support, so egress is by CIDR and port only.
networkPolicy:
  enabled: true
  dns:
    namespaceLabels:
      kubernetes.io/metadata.name: kube-system
    podLabels:
      k8s-app: kube-dns
  # Namespace of the ingress controller; used only when ingress.enabled.
  ingressController:
    namespaceLabels:
      kubernetes.io/metadata.name: ingress-nginx
  # Egress allowlist: list of {name, cidr, ports: [{port, protocol}]}. Typical entry is the
  # private-endpoint subnet range from the network Bicep module (443/TCP). Empty = DNS and
  # intra-release traffic only.
  egressAllowlist: []

api:
  replicas: 2
  repository: neurosphere/api
  port: 8000
  probes:
    readiness: /readyz
    liveness: /healthz
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

workers:
  replicas: 1
  repository: neurosphere/workers
  port: 8090
  probes:
    readiness: /healthz
    liveness: /healthz
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

frontend:
  replicas: 2
  repository: neurosphere/frontend
  port: 8080 # unprivileged static server
  probes:
    readiness: /
    liveness: /
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# PRP-34: publish NeuroSphere's own MCP server through a customer API Management gateway.
# Off by default. When enabled, the API's NS_MCP_RESOURCE_SERVER_URL becomes
# https://<gatewayHost>/mcp so the RFC 9728 resource identifier equals the gateway URL.
mcp:
  apimFront:
    enabled: false
    gatewayHost: "" # required when enabled; host only, no scheme (the gateway host of the created APIM)
