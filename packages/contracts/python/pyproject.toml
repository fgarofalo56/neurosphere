[project]
name = "neurosphere-contracts"
version = "0.0.0"
description = "Generated Pydantic v2 bindings for the NeuroSphere JSON Schema contracts (PRP-01)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.14,<3",
  "jsonschema>=4.26,<5",
]

# Code generators are exact-pinned: generated output is committed and drift-checked, so a
# generator upgrade is a deliberate change (ADR-0004). packages/contracts/scripts/generate.py
# and test_generate.py read this pin; keep them in step.
[dependency-groups]
dev = [
  "datamodel-code-generator==0.83.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurosphere_contracts"]

# Generated modules are formatted by `ruff format` inside generate.py; lint rules that fight
# generator output (long description strings, generated class names) are ignored for the
# generated tree only. Everything else inherits the root configuration.
[tool.ruff]
extend = "../../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"neurosphere_contracts/**" = ["E501", "N815", "RUF001", "RUF002", "RUF003", "UP"]
