# NIST AI Risk Management Framework 1.0, Core categories (PRP-56 item 2).
# Category ids and titles were read from the official AI RMF Core page on source_retrieved;
# titles are short paraphrases, not copied text. A mapping row says what NeuroSphere can observe
# for a control. It is not an assessment and never says an estate meets a control.
framework_id: nist_ai_rmf
title: NIST AI Risk Management Framework (Core categories)
framework_version: "1.0"
source_url: https://airc.nist.gov/airmf-resources/airmf/5-sec-core/
source_retrieved: "2026-11-16"
controls:
  - control_id: nist-ai-rmf.govern-1
    title: Policies and processes for AI risk are in place and used
    support_status: implemented_tested
    evidence_sources: [audit_chain, hitl_decisions]
    repo_paths:
      - packages/core/neurosphere_core/compliance/sources/audit.py
      - packages/core/neurosphere_core/compliance/sources/hitl.py
      - packages/core/tests/compliance_lib/test_sources.py
  - control_id: nist-ai-rmf.govern-2
    title: Accountable, trained teams and individuals for AI risk work
    support_status: implemented_tested
    evidence_sources: [catalog_ownership]
    repo_paths:
      - packages/core/neurosphere_core/compliance/sources/catalog.py
      - packages/core/tests/compliance_lib/test_sources.py
  - control_id: nist-ai-rmf.govern-3
    title: Diversity, equity, inclusion and accessibility in AI risk decisions
    support_status: customer
    evidence_sources: []
    repo_paths: []
  - control_id: nist-ai-rmf.govern-4
    title: Organizational culture that considers and communicates AI risk
    support_status: customer
    evidence_sources: []
    repo_paths: []
  - control_id: nist-ai-rmf.govern-5
    title: Structured engagement with relevant AI actors
    support_status: customer
    evidence_sources: []
    repo_paths: []
