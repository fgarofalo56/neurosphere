# read from the eCFR (point-in-time 2025-01-01) on source_retrieved; titles are short paraphrases.
# NeuroSphere holds metadata only and no ePHI: encryption, transmission security and ePHI
# authentication stay with the customer. This is a mapping, not an assessment.
